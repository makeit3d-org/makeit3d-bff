[build]
builder = "NIXPACKS"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Service-specific configurations
[environments.production.services]

[environments.production.services.celery-worker-video]
startCommand = "celery -A celery_worker worker -Q video_queue -l info --concurrency=2"

[environments.production.services.celery-worker-default]
startCommand = "celery -A celery_worker worker -Q default -l info --concurrency=1"

[environments.production.services.celery-worker-tripo]
startCommand = "celery -A celery_worker worker -Q tripo_other_queue,tripo_refine_queue -l info --concurrency=1"

[environments.production.services.makeit3d-bff]
startCommand = "uvicorn main:app --host 0.0.0.0 --port 8000"